<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark background circle -->
  <circle cx="100" cy="100" r="95" fill="#0a0a0a" stroke="rgba(249, 115, 22, 0.3)" stroke-width="2"/>

  <!-- mQm Chevron Symbol (>) -->
  <g transform="translate(100, 100)">
    <!-- Left chevron -->
    <path d="M -35 -25 L -15 0 L -35 25" stroke="#f97316" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Right chevron -->
    <path d="M -5 -25 L 15 0 L -5 25" stroke="#f97316" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Center chevron (optional accent) -->
    <path d="M 25 -25 L 45 0 L 25 25" stroke="#ea580c" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
  </g>

  <!-- Subtle gradient overlay -->
  <defs>
    <radialGradient id="glowGradient">
      <stop offset="0%" style="stop-color: rgba(249, 115, 22, 0.1); stop-opacity: 1"/>
      <stop offset="100%" style="stop-color: rgba(249, 115, 22, 0); stop-opacity: 0"/>
    </radialGradient>
  </defs>
  <circle cx="100" cy="100" r="95" fill="url(#glowGradient)"/>
</svg>
